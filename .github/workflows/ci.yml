name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref so rapid pushes don't pile up — but
# never cancel on the default branch (we want every main build).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Typecheck, build and unit tests run through the shared node-ci workflow.
  # The workspace has no ESLint or `typecheck` script: the static-analysis gate
  # is the TypeScript compiler, run via each package's `build` (tsc -p ...), so
  # the build step is the typecheck. It also validates the vite app bundles.
  ci:
    uses: xraph/workflows/.github/workflows/node-ci.yml@v1
    with:
      scripts: '["test","build"]'

  # Container image: the entrypoint script tests need no docker, then the smoke
  # script builds the image and runs it read-only beside an echo upstream.
  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Entrypoint tests
        run: sh deploy/docker/entrypoint_test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Smoke test
        run: sh deploy/docker/smoke.sh
