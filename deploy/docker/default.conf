server {
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # Written at container start by 40-fabriq-admin-runtime.sh. Only /tmp is
  # writable in the image, so these two come from there instead of from root.
  location = /config.js {
    alias /tmp/fabriq-admin/config.js;
    add_header Cache-Control "no-store";
  }

  location = /index.html {
    alias /tmp/fabriq-admin/index.html;
    add_header Cache-Control "no-store";
  }

  # Vite fingerprints everything under assets/.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # SPA fallback: any other path serves the rewritten index.html.
  location / {
    try_files $uri /index.html;
  }

  # Empty, or the /admin/ proxy block when FABRIQ_ADMIN_UPSTREAM is set.
  include /tmp/fabriq-admin/upstream.conf;
}
